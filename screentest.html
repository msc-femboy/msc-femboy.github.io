<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>screenexam</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;

      width: 100dvw;
      height: 100dvh;

      display: block;
      background: black;

      touch-action: none;
    }

    /*
      Video используется только как "fullscreen bridge".
      В обычном режиме он скрыт.
    */
    #fullscreenVideo {
      position: fixed;
      left: 0;
      top: 0;

      width: 1px;
      height: 1px;

      opacity: 0;
      pointer-events: none;
    }

    .ui {
      position: fixed;

      top: calc(10px + env(safe-area-inset-top));
      left: calc(10px + env(safe-area-inset-left));

      z-index: 100;

      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;

      max-width: calc(100vw - 50px);

      padding: 10px 15px;

      color: white;
      background: rgba(0, 0, 0, .65);

      border-radius: 8px;
    }

    .ui button {
      padding: 7px 11px;

      border: 0;
      border-radius: 6px;

      color: white;
      background: #444;

      font-size: 14px;

      cursor: pointer;
      touch-action: manipulation;
    }

    .ui button:active {
      background: #666;
    }

    .toggle-button {
      position: fixed;

      top: calc(5px + env(safe-area-inset-top));
      right: calc(5px + env(safe-area-inset-right));

      z-index: 110;

      width: 30px;
      height: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: transparent;

      cursor: pointer;
      touch-action: manipulation;
    }

    .toggle-button span {
      color: white;
      opacity: .6;
      font-size: 14px;
    }

    .color-buttons {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .color-btn {
      width: 30px;
      height: 30px;

      border: 1px solid white;
      border-radius: 4px;

      cursor: pointer;
      touch-action: manipulation;
    }

    /*
      Кнопка выхода.
      Работает для обычного Fullscreen API.
      В iPhone native video fullscreen её скрывает Safari.
    */
    #exitFullscreen {
      position: fixed;

      top: calc(15px + env(safe-area-inset-top));
      right: calc(15px + env(safe-area-inset-right));

      z-index: 200;

      display: none;

      padding: 10px 15px;

      border: 0;
      border-radius: 8px;

      color: white;
      background: rgba(0, 0, 0, .7);

      font-size: 15px;

      touch-action: manipulation;
    }

    #status {
      position: fixed;

      left: 50%;
      bottom: calc(15px + env(safe-area-inset-bottom));

      transform: translateX(-50%);

      z-index: 150;

      display: none;

      padding: 8px 12px;

      border-radius: 8px;

      color: white;
      background: rgba(0, 0, 0, .75);

      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>

  <!-- Основной интерактивный canvas -->
  <canvas id="canvas"></canvas>

  <!--
    Video bridge для iPhone Safari native fullscreen.
    canvas.captureStream() передаёт изображение сюда.
  -->
  <video
    id="fullscreenVideo"
    playsinline
    muted
    autoplay
    webkit-playsinline
  ></video>

  <div class="ui" id="ui">

    <button id="crossColorBtn">
      Invert Crosses
    </button>

    <button id="invertBtn">
      Cross Visibility
    </button>

    <button id="fullscreenBtn">
      Fullscreen
    </button>

    <div class="color-buttons" id="colorButtons"></div>

  </div>

  <div class="toggle-button" id="toggleBtn">
    <span>X</span>
  </div>

  <button id="exitFullscreen">
    ✕ Exit Fullscreen
  </button>

  <div id="status"></div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", {
      alpha: false
    });

    const video = document.getElementById("fullscreenVideo");

    const ui = document.getElementById("ui");
    const toggleBtn = document.getElementById("toggleBtn");

    const fullscreenBtn =
      document.getElementById("fullscreenBtn");

    const exitFullscreenBtn =
      document.getElementById("exitFullscreen");

    const crossColorBtn =
      document.getElementById("crossColorBtn");

    const invertBtn =
      document.getElementById("invertBtn");

    const status =
      document.getElementById("status");

    let invertMode = false;
    let crossColor = "white";
    let bgColor = "black";

    let touches = [];

    let cssWidth = 0;
    let cssHeight = 0;

    let stream = null;

    let videoFullscreen = false;


    /* =========================================
       DEVICE
    ========================================= */

    function isIOS() {
      return (
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (
          navigator.platform === "MacIntel" &&
          navigator.maxTouchPoints > 1
        )
      );
    }


    /* =========================================
       STATUS
    ========================================= */

    function showStatus(text) {
      status.textContent = text;
      status.style.display = "block";

      clearTimeout(showStatus.timer);

      showStatus.timer = setTimeout(() => {
        status.style.display = "none";
      }, 2500);
    }


    /* =========================================
       CANVAS RESIZE
    ========================================= */

    function resizeCanvas() {

      const dpr =
        Math.min(window.devicePixelRatio || 1, 3);

      cssWidth = window.innerWidth;
      cssHeight = window.innerHeight;

      canvas.width =
        Math.round(cssWidth * dpr);

      canvas.height =
        Math.round(cssHeight * dpr);

      canvas.style.width =
        cssWidth + "px";

      canvas.style.height =
        cssHeight + "px";

      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );

      drawCrosses();
    }


    /* =========================================
       DRAW
    ========================================= */

    function drawCrosses() {

      ctx.fillStyle = bgColor;

      ctx.fillRect(
        0,
        0,
        cssWidth,
        cssHeight
      );


      if (!invertMode) {

        ctx.fillStyle = crossColor;

        const step = 45;
        const crossSize = 25;
        const thickness = 5;

        for (
          let y = step / 2;
          y < cssHeight;
          y += step
        ) {

          for (
            let x = step / 2;
            x < cssWidth;
            x += step
          ) {

            drawCross(
              x,
              y,
              crossSize,
              thickness
            );
          }
        }
      }


      /*
        Touch indicators
      */

      ctx.fillStyle =
        "rgba(5,130,0,0.9)";

      for (const t of touches) {

        ctx.beginPath();

        ctx.arc(
          t.x,
          t.y,
          30,
          0,
          Math.PI * 2
        );

        ctx.fill();
      }
    }


    function drawCross(
      x,
      y,
      size,
      thickness
    ) {

      ctx.fillRect(
        x - thickness / 2,
        y - size / 2,
        thickness,
        size
      );

      ctx.fillRect(
        x - size / 2,
        y - thickness / 2,
        size,
        thickness
      );
    }


    /* =========================================
       CANVAS → VIDEO
    ========================================= */

    function createVideoStream() {

      /*
        Safari поддерживает canvas.captureStream
        на современных версиях iOS.
      */

      if (!canvas.captureStream) {

        showStatus(
          "canvas.captureStream() is not supported"
        );

        return false;
      }

      try {

        stream = canvas.captureStream(30);

        video.srcObject = stream;

        video.muted = true;
        video.playsInline = true;

        return true;

      } catch (error) {

        console.error(error);

        return false;
      }
    }


    /* =========================================
       ENTER FULLSCREEN
    ========================================= */

    async function enterFullscreen() {

      /*
        Сначала создаём video stream
      */

      if (!stream) {

        const success =
          createVideoStream();

        if (!success) {
          return;
        }
      }


      /*
        Нужно начать воспроизведение
        непосредственно после user gesture.
      */

      try {

        await video.play();

      } catch (error) {

        console.log(
          "video.play():",
          error
        );
      }


      /*
        iPhone Safari
      */

      if (
        isIOS() &&
        video.webkitEnterFullscreen
      ) {

        try {

          /*
            Главное место обхода.

            Safari переводит VIDEO
            в native fullscreen.
          */

          video.webkitEnterFullscreen();

          videoFullscreen = true;

          ui.style.display = "none";
          toggleBtn.style.display = "none";

          showStatus(
            "Fullscreen. Для выхода используйте кнопку Safari."
          );

          return;

        } catch (error) {

          console.error(
            "iOS fullscreen error:",
            error
          );
        }
      }


      /*
        Обычный Fullscreen API
      */

      if (
        video.requestFullscreen
      ) {

        try {

          await video.requestFullscreen();

          videoFullscreen = true;

          ui.style.display = "none";
          toggleBtn.style.display = "none";

          exitFullscreenBtn.style.display =
            "block";

          return;

        } catch (error) {

          console.error(
            "requestFullscreen error:",
            error
          );
        }
      }


      /*
        Safari / WebKit fallback
      */

      if (
        video.webkitRequestFullscreen
      ) {

        try {

          video.webkitRequestFullscreen();

          videoFullscreen = true;

          ui.style.display = "none";
          toggleBtn.style.display = "none";

        } catch (error) {

          console.error(error);
        }
      }
    }


    /* =========================================
       EXIT FULLSCREEN
    ========================================= */

    async function exitFullscreen() {

      /*
        Обычный Fullscreen API
      */

      if (
        document.fullscreenElement
      ) {

        try {

          await document.exitFullscreen();

        } catch (error) {

          console.error(error);
        }
      }


      /*
        WebKit
      */

      else if (
        document.webkitFullscreenElement &&
        document.webkitExitFullscreen
      ) {

        try {

          document.webkitExitFullscreen();

        } catch (error) {

          console.error(error);
        }
      }


      /*
        iPhone native video fullscreen

        У Safari нет гарантированного JS API
        для принудительного закрытия
        native video fullscreen во всех версиях iOS.

        Поэтому здесь просто восстанавливаем UI,
        когда Safari сообщает об окончании fullscreen.
      */

      videoFullscreen = false;

      ui.style.display = "flex";
      toggleBtn.style.display = "flex";

      exitFullscreenBtn.style.display =
        "none";

      drawCrosses();
    }


    /* =========================================
       FULLSCREEN BUTTON
    ========================================= */

    fullscreenBtn.addEventListener(
      "click",
      async () => {

        await enterFullscreen();

      }
    );


    /* =========================================
       EXIT BUTTON
    ========================================= */

    exitFullscreenBtn.addEventListener(
      "click",
      async () => {

        await exitFullscreen();

      }
    );


    /* =========================================
       FULLSCREEN EVENTS
    ========================================= */

    document.addEventListener(
      "fullscreenchange",
      () => {

        const active =
          !!document.fullscreenElement;

        if (!active) {

          videoFullscreen = false;

          ui.style.display = "flex";
          toggleBtn.style.display = "flex";

          exitFullscreenBtn.style.display =
            "none";
        }
      }
    );


    /*
      WebKit fullscreen events
    */

    document.addEventListener(
      "webkitfullscreenchange",
      () => {

        const active =
          !!document.webkitFullscreenElement;

        if (!active) {

          videoFullscreen = false;

          ui.style.display = "flex";
          toggleBtn.style.display = "flex";

          exitFullscreenBtn.style.display =
            "none";
        }
      }
    );


    /*
      Очень важно для iPhone:
      Safari вызывает это событие,
      когда native video fullscreen закрывается.
    */

    video.addEventListener(
      "webkitendfullscreen",
      () => {

        videoFullscreen = false;

        ui.style.display = "flex";
        toggleBtn.style.display = "flex";

        exitFullscreenBtn.style.display =
          "none";

        drawCrosses();

      }
    );


    video.addEventListener(
      "webkitbeginfullscreen",
      () => {

        videoFullscreen = true;

        ui.style.display = "none";
        toggleBtn.style.display = "none";

      }
    );


    /* =========================================
       CROSS COLOR
    ========================================= */

    crossColorBtn.addEventListener(
      "click",
      () => {

        crossColor =
          crossColor === "white"
            ? "black"
            : "white";

        drawCrosses();
      }
    );


    /* =========================================
       CROSS VISIBILITY
    ========================================= */

    invertBtn.addEventListener(
      "click",
      () => {

        invertMode = !invertMode;

        drawCrosses();
      }
    );


    /* =========================================
       UI TOGGLE
    ========================================= */

    let uiVisible = true;

    toggleBtn.addEventListener(
      "click",
      () => {

        uiVisible = !uiVisible;

        ui.style.display =
          uiVisible
            ? "flex"
            : "none";
      }
    );


    /* =========================================
       COLORS
    ========================================= */

    const colors = [
      "black",
      "white",
      "#303030",
      "#808080",
      "red",
      "blue",
      "green",
      "yellow",
      "purple"
    ];

    const colorButtons =
      document.getElementById(
        "colorButtons"
      );

    colors.forEach(color => {

      const btn =
        document.createElement("div");

      btn.className =
        "color-btn";

      btn.style.backgroundColor =
        color;

      btn.addEventListener(
        "click",
        () => {

          bgColor = color;

          drawCrosses();
        }
      );

      colorButtons.appendChild(btn);
    });


    /* =========================================
       TOUCH
    ========================================= */

    function updateTouches(e) {

      const rect =
        canvas.getBoundingClientRect();

      touches = [];


      /*
        TouchEvent
      */

      if (e.touches) {

        for (
          const p of e.touches
        ) {

          touches.push({
            x: p.clientX - rect.left,
            y: p.clientY - rect.top
          });
        }

      }

      /*
        PointerEvent / MouseEvent
      */

      else {

        touches.push({
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        });
      }

      drawCrosses();
    }


    function clearTouches() {

      touches = [];

      drawCrosses();
    }


    /* =========================================
       TOUCH EVENTS CANVAS
    ========================================= */

    canvas.addEventListener(
      "touchstart",
      e => {

        e.preventDefault();

        updateTouches(e);

      },
      {
        passive: false
      }
    );


    canvas.addEventListener(
      "touchmove",
      e => {

        e.preventDefault();

        updateTouches(e);

      },
      {
        passive: false
      }
    );


    canvas.addEventListener(
      "touchend",
      e => {

        e.preventDefault();

        clearTouches();

      },
      {
        passive: false
      }
    );


    canvas.addEventListener(
      "touchcancel",
      e => {

        e.preventDefault();

        clearTouches();

      },
      {
        passive: false
      }
    );


    /* =========================================
       POINTER EVENTS
    ========================================= */

    canvas.addEventListener(
      "pointerdown",
      e => {

        if (e.pointerType !== "mouse") {

          updateTouches(e);
        }
      }
    );


    canvas.addEventListener(
      "pointermove",
      e => {

        if (
          e.pointerType !== "mouse" &&
          e.buttons
        ) {

          updateTouches(e);
        }
      }
    );


    canvas.addEventListener(
      "pointerup",
      e => {

        if (e.pointerType !== "mouse") {

          clearTouches();
        }
      }
    );


    /* =========================================
       MOUSE
    ========================================= */

    canvas.addEventListener(
      "mousedown",
      updateTouches
    );


    canvas.addEventListener(
      "mousemove",
      e => {

        if (e.buttons) {

          updateTouches(e);
        }
      }
    );


    canvas.addEventListener(
      "mouseup",
      clearTouches
    );


    /* =========================================
       RESIZE
    ========================================= */

    window.addEventListener(
      "resize",
      resizeCanvas
    );


    window.addEventListener(
      "orientationchange",
      () => {

        setTimeout(
          resizeCanvas,
          300
        );
      }
    );


    /* =========================================
       START
    ========================================= */

    resizeCanvas();

  </script>

</body>
</html>
