<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>screenexam</title>

  <!-- iPhone PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="screenexam">

  <!-- Android -->
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: black;

      font-family: sans-serif;

      user-select: none;
      -webkit-user-select: none;

      touch-action: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #canvas {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;

      width: 100dvw;
      height: 100dvh;

      display: block;

      touch-action: none;
    }

    /* Панель */

    .ui {
      position: fixed;

      top: calc(10px + env(safe-area-inset-top));
      left: calc(10px + env(safe-area-inset-left));

      z-index: 10;

      display: flex;
      align-items: center;
      flex-wrap: wrap;

      gap: 10px;

      max-width: calc(100vw - 50px);

      padding: 10px 15px;

      border-radius: 8px;

      background: rgba(0, 0, 0, .65);

      color: white;
    }

    .ui button {
      padding: 7px 11px;

      border: 0;
      border-radius: 6px;

      background: #444;
      color: white;

      font-size: 14px;

      cursor: pointer;

      touch-action: manipulation;
    }

    .ui button:active {
      background: #666;
    }

    /* Цвета */

    .color-buttons {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .color-btn {
      width: 30px;
      height: 30px;

      border: 1px solid white;
      border-radius: 4px;

      cursor: pointer;

      touch-action: manipulation;
    }

    /* Кнопка X */

    .toggle-button {
      position: fixed;

      top: calc(5px + env(safe-area-inset-top));
      right: calc(5px + env(safe-area-inset-right));

      z-index: 20;

      width: 30px;
      height: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: transparent;

      cursor: pointer;

      touch-action: manipulation;
    }

    .toggle-button span {
      color: white;

      font-size: 14px;

      opacity: .6;
    }

    /* Кнопка выхода из fullscreen */

    #exitFullscreen {
      position: fixed;

      top: calc(12px + env(safe-area-inset-top));
      right: calc(12px + env(safe-area-inset-right));

      z-index: 100;

      display: none;

      padding: 10px 14px;

      border: 0;
      border-radius: 8px;

      background: rgba(0, 0, 0, .75);
      color: white;

      font-size: 15px;

      touch-action: manipulation;
    }

    /*
      Подсказка для Safari,
      если страница ещё не установлена
    */

    #installHint {
      position: fixed;

      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom));

      transform: translateX(-50%);

      z-index: 200;

      display: none;

      width: calc(100% - 40px);
      max-width: 420px;

      padding: 16px;

      border-radius: 12px;

      background: rgba(20, 20, 20, .95);
      color: white;

      text-align: center;

      line-height: 1.45;

      font-size: 14px;
    }

    #installHint button {
      margin-top: 12px;

      padding: 8px 14px;

      border: 0;
      border-radius: 7px;

      background: #444;
      color: white;
    }
  </style>
</head>

<body>

  <canvas id="canvas"></canvas>

  <!-- UI -->

  <div class="ui" id="ui">

    <button id="crossColorBtn">
      Invert Crosses
    </button>

    <button id="invertBtn">
      Cross Visibility
    </button>

    <button id="fullscreenBtn">
      Fullscreen
    </button>

    <div
      class="color-buttons"
      id="colorButtons"
    ></div>

  </div>

  <!-- X -->

  <div
    class="toggle-button"
    id="toggleBtn"
  >
    <span>X</span>
  </div>

  <!-- Exit -->

  <button id="exitFullscreen">
    ✕ Exit Fullscreen
  </button>

  <!-- Install hint -->

  <div id="installHint">

    <div>
      Чтобы убрать Safari полностью,
      добавьте страницу на экран «Домой».
    </div>

    <div>
      В Safari нажмите
      <b>Поделиться → На экран «Домой»</b>.
    </div>

    <button id="closeHint">
      Понятно
    </button>

  </div>


  <script>

    const canvas =
      document.getElementById("canvas");

    const ctx =
      canvas.getContext("2d", {
        alpha: false
      });


    const ui =
      document.getElementById("ui");

    const toggleBtn =
      document.getElementById("toggleBtn");

    const fullscreenBtn =
      document.getElementById("fullscreenBtn");

    const exitFullscreenBtn =
      document.getElementById("exitFullscreen");

    const crossColorBtn =
      document.getElementById("crossColorBtn");

    const invertBtn =
      document.getElementById("invertBtn");

    const installHint =
      document.getElementById("installHint");

    const closeHint =
      document.getElementById("closeHint");


    let invertMode = false;

    let crossColor = "white";

    let bgColor = "black";

    let touches = [];

    let width = 0;

    let height = 0;


    /* ==========================
       PWA / STANDALONE
    ========================== */

    function isStandalone() {

      return (
        window.navigator.standalone === true ||
        window.matchMedia(
          "(display-mode: standalone)"
        ).matches ||
        window.matchMedia(
          "(display-mode: fullscreen)"
        ).matches
      );

    }


    /* ==========================
       RESIZE
    ========================== */

    function resizeCanvas() {

      width =
        window.innerWidth;

      height =
        window.innerHeight;


      const dpr =
        Math.min(
          window.devicePixelRatio || 1,
          3
        );


      canvas.width =
        Math.round(width * dpr);

      canvas.height =
        Math.round(height * dpr);


      canvas.style.width =
        width + "px";

      canvas.style.height =
        height + "px";


      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );


      drawCrosses();

    }


    /* ==========================
       DRAW
    ========================== */

    function drawCrosses() {

      /*
        Background
      */

      ctx.fillStyle =
        bgColor;

      ctx.fillRect(
        0,
        0,
        width,
        height
      );


      /*
        Crosses
      */

      if (!invertMode) {

        ctx.fillStyle =
          crossColor;


        const step = 45;

        const crossSize = 25;

        const thickness = 5;


        for (
          let y = step / 2;
          y < height;
          y += step
        ) {

          for (
            let x = step / 2;
            x < width;
            x += step
          ) {

            drawCross(
              x,
              y,
              crossSize,
              thickness
            );

          }

        }

      }


      /*
        Touch circles
      */

      ctx.fillStyle =
        "rgba(5,130,0,.9)";


      for (const touch of touches) {

        ctx.beginPath();

        ctx.arc(
          touch.x,
          touch.y,
          30,
          0,
          Math.PI * 2
        );

        ctx.fill();

      }

    }


    function drawCross(
      x,
      y,
      size,
      thickness
    ) {

      ctx.fillRect(
        x - thickness / 2,
        y - size / 2,
        thickness,
        size
      );


      ctx.fillRect(
        x - size / 2,
        y - thickness / 2,
        size,
        thickness
      );

    }


    /* ==========================
       CROSS COLOR
    ========================== */

    crossColorBtn.addEventListener(
      "click",
      () => {

        crossColor =
          crossColor === "white"
            ? "black"
            : "white";

        drawCrosses();

      }
    );


    /* ==========================
       CROSS VISIBILITY
    ========================== */

    invertBtn.addEventListener(
      "click",
      () => {

        invertMode =
          !invertMode;

        drawCrosses();

      }
    );


    /* ==========================
       COLORS
    ========================== */

    const colors = [
      "black",
      "white",
      "#303030",
      "#808080",
      "red",
      "blue",
      "green",
      "yellow",
      "purple"
    ];


    const colorButtons =
      document.getElementById(
        "colorButtons"
      );


    colors.forEach(
      color => {

        const button =
          document.createElement(
            "div"
          );


        button.className =
          "color-btn";


        button.style.backgroundColor =
          color;


        button.addEventListener(
          "click",
          () => {

            bgColor = color;

            drawCrosses();

          }
        );


        colorButtons.appendChild(
          button
        );

      }
    );


    /* ==========================
       UI TOGGLE
    ========================== */

    let uiVisible = true;


    toggleBtn.addEventListener(
      "click",
      () => {

        uiVisible =
          !uiVisible;


        ui.style.display =
          uiVisible
            ? "flex"
            : "none";

      }
    );


    /* ==========================
       FULLSCREEN
    ========================== */

    fullscreenBtn.addEventListener(
      "click",
      async () => {

        /*
          Если уже PWA —
          мы уже без Safari UI.
        */

        if (isStandalone()) {

          ui.style.display =
            "none";

          toggleBtn.style.display =
            "none";

          exitFullscreenBtn.style.display =
            "block";

          return;
        }


        /*
          Если браузер поддерживает
          обычный Fullscreen API.
        */

        if (
          document.documentElement
            .requestFullscreen
        ) {

          try {

            await document.documentElement
              .requestFullscreen();


            ui.style.display =
              "none";

            toggleBtn.style.display =
              "none";

            exitFullscreenBtn.style.display =
              "block";

            return;

          } catch (error) {

            console.log(
              "Fullscreen:",
              error
            );

          }

        }


        /*
          iPhone Safari.
          Показываем инструкцию.
        */

        installHint.style.display =
          "block";

      }
    );


    /* ==========================
       EXIT FULLSCREEN
    ========================== */

    exitFullscreenBtn.addEventListener(
      "click",
      async () => {

        /*
          Browser fullscreen
        */

        if (
          document.fullscreenElement
        ) {

          try {

            await document.exitFullscreen();

          } catch (error) {

            console.log(error);

          }

        }


        /*
          В PWA кнопка выхода
          просто возвращает UI.
        */

        ui.style.display =
          "flex";

        toggleBtn.style.display =
          "flex";

        exitFullscreenBtn.style.display =
          "none";

      }
    );


    /* ==========================
       FULLSCREEN CHANGE
    ========================== */

    document.addEventListener(
      "fullscreenchange",
      () => {

        if (
          !document.fullscreenElement
        ) {

          ui.style.display =
            "flex";

          toggleBtn.style.display =
            "flex";

          exitFullscreenBtn.style.display =
            "none";

        }

      }
    );


    /* ==========================
       CLOSE INSTALL HINT
    ========================== */

    closeHint.addEventListener(
      "click",
      () => {

        installHint.style.display =
          "none";

      }
    );


    /* ==========================
       TOUCH
    ========================== */

    function updateTouches(e) {

      const rect =
        canvas.getBoundingClientRect();


      touches = [];


      for (
        const touch of e.touches
      ) {

        touches.push({

          x:
            touch.clientX -
            rect.left,

          y:
            touch.clientY -
            rect.top

        });

      }


      drawCrosses();

    }


    canvas.addEventListener(
      "touchstart",
      e => {

        e.preventDefault();

        updateTouches(e);

      },
      {
        passive: false
      }
    );


    canvas.addEventListener(
      "touchmove",
      e => {

        e.preventDefault();

        updateTouches(e);

      },
      {
        passive: false
      }
    );


    canvas.addEventListener(
      "touchend",
      e => {

        e.preventDefault();

        touches = [];

        drawCrosses();

      },
      {
        passive: false
      }
    );


    canvas.addEventListener(
      "touchcancel",
      e => {

        e.preventDefault();

        touches = [];

        drawCrosses();

      },
      {
        passive: false
      }
    );


    /* ==========================
       MOUSE
    ========================== */

    canvas.addEventListener(
      "mousedown",
      e => {

        const rect =
          canvas.getBoundingClientRect();

        touches = [{
          x:
            e.clientX -
            rect.left,

          y:
            e.clientY -
            rect.top
        }];

        drawCrosses();

      }
    );


    canvas.addEventListener(
      "mousemove",
      e => {

        if (!e.buttons)
          return;


        const rect =
          canvas.getBoundingClientRect();


        touches = [{
          x:
            e.clientX -
            rect.left,

          y:
            e.clientY -
            rect.top
        }];


        drawCrosses();

      }
    );


    canvas.addEventListener(
      "mouseup",
      () => {

        touches = [];

        drawCrosses();

      }
    );


    /* ==========================
       RESIZE
    ========================== */

    window.addEventListener(
      "resize",
      resizeCanvas
    );


    window.addEventListener(
      "orientationchange",
      () => {

        setTimeout(
          resizeCanvas,
          300
        );

      }
    );


    /* ==========================
       INIT
    ========================== */

    resizeCanvas();


    /*
      Если приложение уже запущено
      как PWA — показываем кнопку Exit.
    */

    if (isStandalone()) {

      fullscreenBtn.textContent =
        "Fullscreen";

    }


    /*
      Service Worker
    */

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register("./sw.js")
            .catch(error => {

              console.log(
                "Service Worker:",
                error
              );

            });

        }
      );

    }

  </script>

</body>
</html>
