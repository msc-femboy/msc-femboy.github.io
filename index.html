<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover,
               user-scalable=no">

<title>screenexam</title>

<link rel="manifest" href="/manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="screenexam">
<meta name="mobile-web-app-capable" content="yes">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

body {
    position: fixed;

    width: 100%;
    height: 100%;

    left: 0;
    top: 0;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #000;

    touch-action: none;

    overscroll-behavior: none;
}

/* CANVAS */

#canvas {
    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    width: 100dvw;
    height: 100dvh;

    display: block;

    margin: 0;
    padding: 0;

    background: #000;

    touch-action: none;
}

/* CONTROLS */

#controls {
    position: fixed;

    top: 10px;
    left: 10px;

    z-index: 100;

    display: flex;
    flex-wrap: wrap;

    gap: 7px;

    max-width: calc(100vw - 20px);

    padding: 8px;

    border-radius: 12px;

    background: rgba(0,0,0,.75);

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

button {
    border: 1px solid #777;

    border-radius: 8px;

    padding: 9px 12px;

    background: #222;
    color: #fff;

    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: 600;

    touch-action: manipulation;

    user-select: none;
    -webkit-user-select: none;
}

button:active {
    transform: scale(.96);
}

/* COLOR BUTTONS */

.color-button {
    width: 34px;
    height: 34px;

    padding: 0;

    border-radius: 50%;
}

#blackBtn {
    background: #000;
}

#whiteBtn {
    background: #fff;
}

#gray30Btn {
    background: #303030;
}

#gray80Btn {
    background: #808080;
}

#redBtn {
    background: red;
}

#blueBtn {
    background: blue;
}

#greenBtn {
    background: green;
}

#yellowBtn {
    background: yellow;
}

#purpleBtn {
    background: purple;
}

/* UI BUTTON */

#toggleUI {
    position: fixed;

    top: 10px;
    right: 10px;

    z-index: 200;

    width: 42px;
    height: 42px;

    padding: 0;

    border-radius: 50%;

    background: rgba(0,0,0,.8);
}

/* INSTALL MESSAGE */

#installHint {
    position: fixed;

    z-index: 300;

    left: 50%;
    bottom: 20px;

    transform: translateX(-50%);

    width: 90%;
    max-width: 420px;

    padding: 15px;

    border-radius: 12px;

    background: rgba(0,0,0,.9);

    color: white;

    font-family: Arial, sans-serif;
    font-size: 14px;

    line-height: 1.5;

    text-align: center;

    display: none;
}

#installHint strong {
    display: block;
    margin-bottom: 5px;
}

#closeHint {
    margin-top: 10px;
}

/* HIDDEN UI */

body.ui-hidden #controls,
body.ui-hidden #installHint {
    display: none !important;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="controls">

    <button id="invertBtn">
        Invert Crosses
    </button>

    <button id="visibilityBtn">
        Cross Visibility
    </button>

    <button id="fullscreenBtn">
        Fullscreen
    </button>

    <button id="clearBtn">
        Clear
    </button>

    <button id="blackBtn"
            class="color-button"></button>

    <button id="whiteBtn"
            class="color-button"></button>

    <button id="gray30Btn"
            class="color-button"></button>

    <button id="gray80Btn"
            class="color-button"></button>

    <button id="redBtn"
            class="color-button"></button>

    <button id="blueBtn"
            class="color-button"></button>

    <button id="greenBtn"
            class="color-button"></button>

    <button id="yellowBtn"
            class="color-button"></button>

    <button id="purpleBtn"
            class="color-button"></button>

</div>

<button id="toggleUI">✕</button>

<div id="installHint">

    <strong>True fullscreen on iPhone</strong>

    Safari →
    Share →
    Add to Home Screen

    <br>

    Then open screenexam from the Home Screen.

    <br>

    <button id="closeHint">
        Close
    </button>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let crossColor = "#ffffff";
let backgroundColor = "#000000";

let crossesVisible = true;

const CROSS_STEP = 45;
const CROSS_SIZE = 25;
const CROSS_THICKNESS = 5;

let touches = new Map();


/* ==========================================
   CANVAS
========================================== */

function resizeCanvas() {

    const dpr = window.devicePixelRatio || 1;

    const width = window.innerWidth;
    const height = window.innerHeight;

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    draw();
}


window.addEventListener(
    "resize",
    resizeCanvas
);

window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            resizeCanvas,
            100
        );

    }
);


/* ==========================================
   DRAW
========================================== */

function draw() {

    const width = window.innerWidth;
    const height = window.innerHeight;

    ctx.fillStyle = backgroundColor;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    if (crossesVisible) {
        drawCrosses();
    }


    drawTouchPoints();
}


/* ==========================================
   CROSSES
========================================== */

function drawCrosses() {

    const width = window.innerWidth;
    const height = window.innerHeight;

    ctx.fillStyle = crossColor;

    for (
        let y = 0;
        y <= height;
        y += CROSS_STEP
    ) {

        for (
            let x = 0;
            x <= width;
            x += CROSS_STEP
        ) {

            const half =
                CROSS_SIZE / 2;

            const thickness =
                CROSS_THICKNESS;


            ctx.fillRect(
                x - half,
                y - thickness / 2,
                CROSS_SIZE,
                thickness
            );


            ctx.fillRect(
                x - thickness / 2,
                y - half,
                thickness,
                CROSS_SIZE
            );
        }
    }
}


/* ==========================================
   TOUCH POINTS
========================================== */

function drawTouchPoints() {

    ctx.fillStyle = "#00ff00";

    touches.forEach(point => {

        ctx.beginPath();

        ctx.arc(
            point.x,
            point.y,
            15,
            0,
            Math.PI * 2
        );

        ctx.fill();

    });
}


/* ==========================================
   MOUSE
========================================== */

canvas.addEventListener(
    "mousedown",
    event => {

        touches.set(
            "mouse",
            {
                x: event.clientX,
                y: event.clientY
            }
        );

        draw();
    }
);


canvas.addEventListener(
    "mousemove",
    event => {

        if (event.buttons) {

            touches.set(
                "mouse",
                {
                    x: event.clientX,
                    y: event.clientY
                }
            );

            draw();
        }
    }
);


canvas.addEventListener(
    "mouseup",
    () => {

        touches.delete("mouse");

        draw();
    }
);


/* ==========================================
   TOUCH
========================================== */

canvas.addEventListener(
    "touchstart",
    event => {

        event.preventDefault();

        for (
            const touch of event.changedTouches
        ) {

            touches.set(
                touch.identifier,
                {
                    x: touch.clientX,
                    y: touch.clientY
                }
            );
        }

        draw();

    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchmove",
    event => {

        event.preventDefault();

        for (
            const touch of event.changedTouches
        ) {

            touches.set(
                touch.identifier,
                {
                    x: touch.clientX,
                    y: touch.clientY
                }
            );
        }

        draw();

    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchend",
    event => {

        event.preventDefault();

        for (
            const touch of event.changedTouches
        ) {

            touches.delete(
                touch.identifier
            );
        }

        draw();

    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchcancel",
    event => {

        event.preventDefault();

        for (
            const touch of event.changedTouches
        ) {

            touches.delete(
                touch.identifier
            );
        }

        draw();

    },
    {
        passive: false
    }
);


/* ==========================================
   BUTTONS
========================================== */

document
.getElementById("invertBtn")
.addEventListener(
    "click",
    () => {

        if (
            crossColor === backgroundColor
        ) {

            crossColor = "#ffffff";

        } else {

            crossColor = backgroundColor;
        }

        draw();
    }
);


document
.getElementById("visibilityBtn")
.addEventListener(
    "click",
    () => {

        crossesVisible =
            !crossesVisible;

        draw();
    }
);


document
.getElementById("clearBtn")
.addEventListener(
    "click",
    () => {

        touches.clear();

        draw();
    }
);


/* ==========================================
   BACKGROUND COLORS
========================================== */

function setBackground(color) {

    backgroundColor = color;

    if (
        crossColor === backgroundColor
    ) {

        crossColor = "#ffffff";
    }

    draw();
}


document
.getElementById("blackBtn")
.addEventListener(
    "click",
    () => setBackground("#000000")
);


document
.getElementById("whiteBtn")
.addEventListener(
    "click",
    () => setBackground("#ffffff")
);


document
.getElementById("gray30Btn")
.addEventListener(
    "click",
    () => setBackground("#303030")
);


document
.getElementById("gray80Btn")
.addEventListener(
    "click",
    () => setBackground("#808080")
);


document
.getElementById("redBtn")
.addEventListener(
    "click",
    () => setBackground("#ff0000")
);


document
.getElementById("blueBtn")
.addEventListener(
    "click",
    () => setBackground("#0000ff")
);


document
.getElementById("greenBtn")
.addEventListener(
    "click",
    () => setBackground("#008000")
);


document
.getElementById("yellowBtn")
.addEventListener(
    "click",
    () => setBackground("#ffff00")
);


document
.getElementById("purpleBtn")
.addEventListener(
    "click",
    () => setBackground("#800080")
);


/* ==========================================
   UI
========================================== */

document
.getElementById("toggleUI")
.addEventListener(
    "click",
    () => {

        document.body
            .classList
            .toggle("ui-hidden");

        const hidden =
            document.body.classList
            .contains("ui-hidden");

        document.getElementById(
            "toggleUI"
        ).textContent =
            hidden ? "☰" : "✕";

    }
);


/* ==========================================
   FULLSCREEN
========================================== */

function isStandalone() {

    return (
        window.navigator.standalone === true ||
        window.matchMedia(
            "(display-mode: standalone)"
        ).matches ||
        window.matchMedia(
            "(display-mode: fullscreen)"
        ).matches
    );
}


document
.getElementById("fullscreenBtn")
.addEventListener(
    "click",
    async () => {

        if (isStandalone()) {

            document.body
                .classList
                .add("ui-hidden");

            document.getElementById(
                "toggleUI"
            ).textContent = "☰";

            draw();

            return;
        }


        try {

            if (
                document.fullscreenElement
            ) {

                await document.exitFullscreen();

            } else if (
                canvas.requestFullscreen
            ) {

                await canvas.requestFullscreen();

            } else {

                showInstallHint();

            }

        } catch (error) {

            console.log(
                "Fullscreen unavailable",
                error
            );

            showInstallHint();
        }

    }
);


/* ==========================================
   INSTALL HINT
========================================== */

const installHint =
    document.getElementById(
        "installHint"
    );


function showInstallHint() {

    installHint.style.display =
        "block";
}


document
.getElementById("closeHint")
.addEventListener(
    "click",
    () => {

        installHint.style.display =
            "none";

    }
);


/* ==========================================
   SERVICE WORKER
========================================== */

if (
    "serviceWorker" in navigator
) {

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register("/sw.js")
                .then(
                    registration => {

                        console.log(
                            "SW registered:",
                            registration.scope
                        );

                    }
                )
                .catch(
                    error => {

                        console.log(
                            "SW error:",
                            error
                        );

                    }
                );

        }
    );
}


/* ==========================================
   START
========================================== */

resizeCanvas();

</script>

</body>
</html>
